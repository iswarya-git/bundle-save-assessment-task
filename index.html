<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Bundle & Save</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>
  <script src="script.js" defer></script>
  <div class="bundle-box">
    <div class="line-with-text">
      <span>Bundle & Save</span>
    </div>

    <div class="option" data-price="195">
      <div class="flexbox">
        <div class="flexbox">
          <div class="circle">
            <div class="dot"></div>
          </div>
          <span>
            <label>1 Pair</label>
            <label><b>DKK 195.00</b></label>
          </span>
        </div>
        <label><b>50% OFF</b></label>
      </div>
      <div class="dropdowns-container">
        <div class="dropdowns">
          <span class="small-tags">#1</span>
          <select>
            <option>S</option>
            <option>#5</option>
            <option>#6</option>
          </select>
          <select>
            <option>Colour</option>
            <option>Black</option>
            <option>White</option>
          </select>
        </div>
        <div class="dropdowns">
          <span class="small-tags">#2</span>
          <select>
            <option>S</option>
            <option>#5</option>
            <option>#6</option>
          </select>
          <select>
            <option>Colour</option>
            <option>Black</option>
            <option>White</option>
          </select>
        </div>
      </div>
    </div>

    <div class="option selected" data-price="360">
      <div class="flexbox">
        <div class="flexbox">
          <div class="circle">
            <div class="dot"></div>
          </div>
          <span>
            <label>2 Pair</label>
            <label><b>DKK 360.00</b></label>
          </span>
        </div>
        <div>
          <span class="tags">Most Popular</span>
          <label><b>40% OFF</b></label>
        </div>
      </div>
      <div class="dropdowns-container">
        <div class="dropdowns">
          <span class="small-tags">#1</span>
          <select>
            <option>S</option>
            <option>#5</option>
            <option>#6</option>
          </select>
          <select>
            <option>Colour</option>
            <option>Black</option>
            <option>White</option>
          </select>
        </div>
        <div class="dropdowns">
          <span class="small-tags">#2</span>
          <select>
            <option>S</option>
            <option>#5</option>
            <option>#6</option>
          </select>
          <select>
            <option>Colour</option>
            <option>Black</option>
            <option>White</option>
          </select>
        </div>
      </div>
    </div>

    <div class="option" data-price="528">
      <div class="flexbox">
        <div class="flexbox">
          <div class="circle">
            <div class="dot"></div>
          </div>
          <span>
            <label>3 Pair</label>
            <label><b>DKK 528.00</b></label>
          </span>
        </div>
        <label><b>60% OFF</b></label>
      </div>
      <div class="dropdowns-container">
        <div class="dropdowns">
          <span class="small-tags">#1</span>
          <select>
            <option>S</option>
            <option>#5</option>
            <option>#6</option>
          </select>
          <select>
            <option>Colour</option>
            <option>Black</option>

          </select>
        </div>

          <span class="small-tags">#2</span>

            <option>S</option>
            <option>#5</option>
            <option>#6</option>
          </select>
          <select>
            <option>Colour</option>
            <option>Black</option>
            <option>White</option>
          </select>
        </div>
      </div>
    </div>

    <div class="flexbox">
      <div class="tags">Free 2 Day Shipping</div>
      <div class="total"><label class="small-tags">Total:</label> <strong id="total-amount">DKK 360.00</strong></div>
    </div>
    <button> + Add to Cart</button>
  </div>

</html>
